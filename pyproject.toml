[project]
name = "arnie-lab"
version = "0.1.0"
description = "A multimodal AI assistant with real tools, cost telemetry and side-by-side model comparison"
requires-python = ">=3.12"
dependencies = [
    "gradio>=5.47.2,<6.0",
    "litellm>=1.77.5",
    "openai>=1.109.1",
    "pillow>=11.0.0",
    "python-dotenv>=1.1.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "ruff>=0.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
