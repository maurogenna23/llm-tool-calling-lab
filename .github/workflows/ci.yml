name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      # A venv rather than --system: the runner's Python is Debian-managed and
      # refuses installs into /usr.
      - run: uv venv
      - run: uv pip install -e ".[dev]"
      - run: uv run ruff check .
      # No API keys and no network: SQLite and a scripted backend.
      - run: uv run pytest
